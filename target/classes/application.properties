# Database Configuration
spring.datasource.url=jdbc:sqlite:data/clinic.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.sqlite.hibernate.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update

# JPA Configuration
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server Configuration
server.port=8080

# Logging Configuration
logging.level.org.springframework=INFO
logging.level.com.icc.clinic=DEBUG

# Encryption Configuration
# Set a fixed key for development (32 characters recommended)
# Leave empty for development (random key will be generated)
clinic.encryption.key=MySecretKey12345678901234567890 